services:
  db:
    container_name: hackathon-db
    image: ankane/pgvector
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hackathon
    volumes:
      - hackathon_db_data:/var/lib/postgresql/data

volumes:
  hackathon_db_data:
